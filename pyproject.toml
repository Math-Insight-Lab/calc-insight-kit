[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calc-insight-kit"
version = "1.0.0"
description = "3-Tier Differentiated Calculus Visualization & Teaching Toolkit (Final Version)"
requires-python = ">=3.8"
license = "MIT"

dependencies = [
    "sympy>=1.11.0",
    "numpy>=1.24.0",
    "matplotlib>=3.6.0",
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
